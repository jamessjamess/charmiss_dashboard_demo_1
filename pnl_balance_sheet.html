<script>
/* ============================================================================
   Balance Sheet — a self-contained mock data domain (Equity and Cash tie
   exactly to Equity Changes/Cash Flow only at the Q1'26/Q2'26 anchors those
   pages share; every other period is this page's own independently
   backfilled illustrative trend — see the "Anchor-only reconciliation"
   comment above backfillSeries()). The accounting identity itself (Total
   Assets = Total Liabilities + Equity) holds exactly in every period, by
   construction, since Equity is always solved as the plug. Chart-first
   (2026-08-12): Asset/Liabilities&Equity Breakdown lead as multi-period
   trend charts (Part B); the Condensed table is a collapsed SSOT reference
   at the end, not the lead (Part A).
   ============================================================================ */
function resolveColor(cssColorOrVar){
  const m = /var\((--[a-z0-9-]+)\)/i.exec(cssColorOrVar);
  return m ? (cssVar(m[1]) || '#999') : cssColorOrVar;
}

/* --- Balance Sheet snapshot (Q1'26 vs Q2'26). Q1 categories are already
   clean round numbers by construction (sum to exactly 310). Q2 categories
   are each independently grown, which (bug fix, Financial Statement
   restructure) does NOT tie to a clean total at display precision on its
   own (raw sum was 324.927M, e.g. "Others" alone raw-computes to ~10.01M) --
   fixed the same way every other rounding-sum mismatch in this dashboard is
   fixed: round the anchor total first, round every category except the
   smallest ("Others") to the nearest ฿0.1M, then derive "Others" as the
   plug so the categories always sum to EXACTLY the rounded total. Equity is
   solved as its own plug (TotalAssetsR − AP − Lease − OtherLiab) so Total
   Assets always equals Total Liabilities + Equity exactly. */
const ASSET_Q1 = { 'Cash & cash equivalents':40e6, 'Trade & other receivables':54e6, 'Inventories':88e6, 'Prepaid expenses':11e6, 'Property & Equipment':54e6, 'Right-of-use assets':37e6, 'Intangible assets':15e6, 'Others':11e6 };
const ASSET_GROWTH = { 'Cash & cash equivalents':0.125, 'Trade & other receivables':0.074, 'Inventories':0.045, 'Prepaid expenses':0.09, 'Property & Equipment':0.018, 'Right-of-use assets':0.027, 'Intangible assets':0.0, 'Others':-0.09 };
const ASSET_CATEGORIES = Object.keys(ASSET_Q1);
const OTHERS_IDX = ASSET_CATEGORIES.indexOf('Others');
const LIAB_Q1 = { 'Trade & other payables':58e6, 'Lease liabilities':34e6, 'Other liabilities':16e6 };
const LIAB_GROWTH = { 'Trade & other payables':0.069, 'Lease liabilities':0.029, 'Other liabilities':0.125 };
const LIAB_CATEGORIES = Object.keys(LIAB_Q1);

/* ---------- Filter bar (2026-08-12 chart-first + multi-period restructure) ----------
   Extended from 3 back-steps to 5 (Q4'24/Q1'25 added ahead of the original
   Q2'25) so Annual View By has a real FY2024 (Q4'24 quarter-end) snapshot to
   show -- Q2'25 through Q2'26 (the original 5 quarters) are BYTE-IDENTICAL
   to before: backfillSeries still computes each of them via the exact same
   inverse-compounding-from-the-Q1'26-anchor + "round total, plug the
   smallest category" formula, just with 2 more (independently rounded) rows
   ahead of them now. Q1'26 and Q2'26 themselves remain the untouched
   original reconciling figures.

   Anchor-only reconciliation (confirmed): Equity ties exactly to Equity
   Changes' Closing Equity, and Cash ties exactly to Cash Flow's Ending
   Cash, ONLY at the Q1'26/Q2'26 anchors those 2 pages also anchor to --
   every earlier quarter here (Q4'24-Q4'25) is this page's OWN independently
   backfilled illustrative trend, same "smooth trend leading into the real
   anchor" convention Cash Flow/Equity Changes use for their own trailing
   quarters (2026-08-12 closeout: the on-page footnote explaining this was
   cut module-wide -- ties/anchors are still documented here in code). */
function backfillSeries(categories, anchorValues, growth, othersIdx, backSteps){
  // Returns backSteps+1 rounded rows, anchorValues sitting at the LAST
  // index (backSteps); every earlier index is anchorValues inverse-
  // compounded one quarter at a time, then rounded the same "round total
  // first, plug the smallest category" way the original Q1->Q2 growth step
  // already does. othersIdx is the category index to use as the rounding
  // plug, or undefined to skip plugging (liabilities have no dedicated
  // "Others" catch-all category).
  const raw = new Array(backSteps+1);
  raw[backSteps] = anchorValues;
  for(let i=backSteps-1;i>=0;i--) raw[i] = categories.map((c,ci)=> raw[i+1][ci]/(1+growth[c]));
  return raw.map((row,qi)=>{
    if(qi===backSteps) return row; // anchor (Q1'26) -- exact, unchanged
    const total = roundToNearestTHB100K(row.reduce((a,b)=>a+b,0));
    const rounded = row.map((v,i)=> i===othersIdx ? v : roundToNearestTHB100K(v));
    if(othersIdx!==undefined) rounded[othersIdx] = total - rounded.reduce((a,b,i)=> i===othersIdx ? a : a+b, 0);
    return rounded;
  });
}
const BACK_STEPS = 5; // Q1'26 anchor minus 5 quarters = Q4'24
const assetByQ = backfillSeries(ASSET_CATEGORIES, ASSET_CATEGORIES.map(k=>ASSET_Q1[k]), ASSET_GROWTH, OTHERS_IDX, BACK_STEPS);
const assetQ2Raw = ASSET_CATEGORIES.map(k=>ASSET_Q1[k]*(1+ASSET_GROWTH[k]));
const totalAssetsQ2 = roundToNearestTHB100K(assetQ2Raw.reduce((a,b)=>a+b,0));
const assetQ2 = assetQ2Raw.map((v,i)=> i===OTHERS_IDX ? v : roundToNearestTHB100K(v));
assetQ2[OTHERS_IDX] = totalAssetsQ2 - assetQ2.reduce((a,b,i)=> i===OTHERS_IDX ? a : a+b, 0);
assetByQ.push(assetQ2); // idx6 -- Q2'26, exact, unchanged
const totalAssetsByQ = assetByQ.map(row=> row.reduce((a,b)=>a+b,0));

const liabByQ = backfillSeries(LIAB_CATEGORIES, LIAB_CATEGORIES.map(k=>LIAB_Q1[k]), LIAB_GROWTH, undefined, BACK_STEPS);
const liabQ2 = LIAB_CATEGORIES.map(k=>roundToNearestTHB100K(LIAB_Q1[k]*(1+LIAB_GROWTH[k])));
liabByQ.push(liabQ2); // idx6 -- Q2'26, exact, unchanged
// Equity is always the plug (Total Assets - Total Liabilities) so the
// accounting identity holds exactly for all 7 quarters, not just Q1/Q2.
const equityByQ = liabByQ.map((row,qi)=> totalAssetsByQ[qi] - row.reduce((a,b)=>a+b,0));
const liabEquityCategories = [...LIAB_CATEGORIES, 'Equity'];
const liabEquityByQ = liabByQ.map((row,qi)=> [...row, equityByQ[qi]]);

function quarterYearLabel(startIdx){
  const q = (Math.floor(startIdx/3)%4)+1, yr = 2024+Math.floor(startIdx/12);
  return 'Q'+q+"'"+String(yr).slice(2);
}
const TODAY = 29;
const curQuarterStart = Math.floor(TODAY/3)*3;
// idx0=Q4'24 1=Q1'25 2=Q2'25 3=Q3'25 4=Q4'25 5=Q1'26 6=Q2'26
const quarterStarts = [curQuarterStart-18, curQuarterStart-15, curQuarterStart-12, curQuarterStart-9, curQuarterStart-6, curQuarterStart-3, curQuarterStart];
const quarterLabels = quarterStarts.map(quarterYearLabel);

// Annual (fiscal-year-end) anchors -- FY2024/FY2025 are real closed-year
// snapshots (this page's own Q4'24/Q4'25 quarter-ends, idx0/idx4); "2026
// (Current)" is simply the latest available snapshot (idx6, Q2'26) -- NOT a
// YTD/partial figure the way a flow statement's still-open-year bucket is,
// since a Balance Sheet snapshot is always complete as of its date (Part
// C) -- labeled "(Current)" only to flag FY2026 itself hasn't closed yet,
// not that this number is provisional. fy2024 has no prior year to compare
// against (idx-1 doesn't exist), so it's a valid chart bucket but not a
// selectable AS OF option -- same "no baseline" reasoning used elsewhere on
// this dashboard (e.g. Financial Analysis's old Growth Rate FY2024 bucket).
const ANNUAL_IDX = { fy2024:0, fy2025:4, current:6 };
const ANNUAL_LABEL = { 0:'FY2024', 4:'FY2025', 6:'2026 (Current)' };
let pnlQuarterAnchor = 6; // default Q2'26 (idx6, the last)
let pnlAnnualAnchor = 'current';
let currentViewBy = 'quarterly';
function currentAsOfLabel(){ return currentViewBy==='annual' ? ANNUAL_LABEL[ANNUAL_IDX[pnlAnnualAnchor]] : quarterLabels[pnlQuarterAnchor]; }
function activeQIdx(){ return currentViewBy==='annual' ? ANNUAL_IDX[pnlAnnualAnchor] : pnlQuarterAnchor; }
// Multi-period window ending at the AS OF anchor (Part B) -- Quarterly: up
// to 5 quarters, clipped at idx0 if the anchor is early. Annual: FY2024
// alone / FY2024+FY2025 / all 3, depending on anchor -- same "anchor clips
// the window" convention this dashboard's Annual View By uses everywhere.
function activeWindow(){
  if(currentViewBy==='annual'){
    const idxs = pnlAnnualAnchor==='fy2025' ? [ANNUAL_IDX.fy2024, ANNUAL_IDX.fy2025] : [ANNUAL_IDX.fy2024, ANNUAL_IDX.fy2025, ANNUAL_IDX.current];
    return { idxs, labels: idxs.map(i=>ANNUAL_LABEL[i]) };
  }
  const startIdx = Math.max(0, pnlQuarterAnchor-4);
  const idxs = []; for(let i=startIdx;i<=pnlQuarterAnchor;i++) idxs.push(i);
  return { idxs, labels: idxs.map(i=>quarterLabels[i]) };
}
// "Selected + prior" pair for the collapsible detailed table's Δ/%change
// columns (still a 2-period compare, per spec) -- prior is simply the
// period immediately before the AS OF anchor in this page's own model
// (Annual: the previous FY-end/anchor, not literally the previous quarter).
function priorIdx(){
  if(currentViewBy==='annual') return pnlAnnualAnchor==='fy2025' ? ANNUAL_IDX.fy2024 : ANNUAL_IDX.fy2025;
  return pnlQuarterAnchor-1;
}

/* ---------- Nav menu / popovers ---------- */
if (typeof renderNavMenu === 'function') {
  try { renderNavMenu('pnl-balance', 'Financial Statement · Balance Sheet'); } catch(e) { console.error('Nav menu render failed:', e); }
}
initInfoPopovers();
initSectionScrollSpy();

(function initMenubarCollapse(){
  const wrap = document.getElementById('pageHeaderSticky');
  const btn = document.getElementById('menubarCollapseBtn');
  if(!wrap || !btn) return;
  const STORAGE_KEY = 'charmiss_menubar_collapsed';
  function updateScrollPadding(){
    requestAnimationFrame(()=>{
      document.documentElement.style.scrollPaddingTop = (wrap.getBoundingClientRect().height + 12) + 'px';
    });
  }
  function setCollapsed(collapsed){
    wrap.classList.toggle('menubar-collapsed', collapsed);
    btn.setAttribute('aria-expanded', String(!collapsed));
    btn.title = collapsed ? 'ขยาย Menu Bar' : 'พับ Menu Bar';
    try{ localStorage.setItem(STORAGE_KEY, collapsed ? '1' : '0'); }catch(e){}
    updateScrollPadding();
  }
  let initial = false;
  try{ initial = localStorage.getItem(STORAGE_KEY) === '1'; }catch(e){}
  setCollapsed(initial);
  btn.addEventListener('click', ()=> setCollapsed(!wrap.classList.contains('menubar-collapsed')));
  window.addEventListener('resize', updateScrollPadding);
})();

const RAG_COLORS = ['var(--cat-1)','var(--cat-2)','var(--cat-3)','var(--cat-4)','var(--cat-5)','var(--cat-6)','var(--brand)','var(--ink-3)'];
let latestData = {};

function labelForIdx(idx){ return currentViewBy==='annual' ? ANNUAL_LABEL[idx] : quarterLabels[idx]; }
function renderAll(){
  // AS OF selects the snapshot period; the collapsible table always
  // compares it to the period immediately before it (q=selected, p=prior).
  // The 2 charts show the FULL multi-period window instead (Part B).
  const win = activeWindow();
  const q = win.idxs[win.idxs.length-1], p = priorIdx();
  const qLabel = labelForIdx(q), pLabel = labelForIdx(p);
  const assetQ1 = assetByQ[p], assetQ2 = assetByQ[q];
  const totalAssetsQ1 = totalAssetsByQ[p], totalAssetsQ2 = totalAssetsByQ[q];
  const liabQ1 = liabByQ[p], liabQ2 = liabByQ[q];
  const liabEquityQ1 = liabEquityByQ[p], liabEquityQ2 = liabEquityByQ[q];
  const equityQ1 = equityByQ[p], equityQ2 = equityByQ[q];

  /* === Condensed Balance Sheet table === Same figures as the Asset/
     Liabilities & Equity Breakdown charts below (both bold subtotal rows
     derive from the SAME assetQ2/liabEquityQ2 arrays those charts plot), so
     this table and those charts never drift apart. */
  const condensedRows = [];
  ASSET_CATEGORIES.forEach((name,i)=> condensedRows.push({ label:name, q1:assetQ1[i], q2:assetQ2[i] }));
  condensedRows.push({ label:'Total Assets', q1:totalAssetsQ1, q2:totalAssetsQ2, bold:true });
  liabEquityCategories.forEach((name,i)=>{
    if(name==='Equity') return; // Equity row inserted after Total Liabilities, per statement convention
    condensedRows.push({ label:name, q1:liabEquityQ1[i], q2:liabEquityQ2[i] });
  });
  const totalLiabQ1 = liabQ1.reduce((a,b)=>a+b,0), totalLiabQ2 = liabQ2.reduce((a,b)=>a+b,0);
  condensedRows.push({ label:'Total Liabilities', q1:totalLiabQ1, q2:totalLiabQ2, bold:true });
  condensedRows.push({ label:'Equity', q1:equityQ1, q2:equityQ2 });
  condensedRows.push({ label:'Total Liabilities & Equity', q1:totalLiabQ1+equityQ1, q2:totalLiabQ2+equityQ2, bold:true });
  document.getElementById('condensedTable').innerHTML =
    '<thead><tr><th>Line Item</th><th>'+pLabel+'</th><th>'+qLabel+'</th><th>Δ</th><th>% Change</th></tr></thead><tbody>'
    + condensedRows.map(r=>{
        const rowClass = r.bold ? ' class="income-stmt-total"' : '';
        const delta = r.q2 - r.q1;
        const pct = r.q1 ? (delta/r.q1*100) : 0;
        return '<tr'+rowClass+'><td>'+r.label+'</td><td class="tnum">'+fmtTHB(r.q1)+'</td><td class="tnum">'+fmtTHB(r.q2)+'</td>'
          + '<td class="tnum"><span class="'+deltaClass(delta)+'">'+(delta>=0?'+':'')+fmtTHB(delta)+'</span></td>'
          + '<td class="tnum"><span class="'+deltaClass(pct)+'">'+fmtSignedPct(pct,1)+'</span></td></tr>';
      }).join('')
    + '</tbody>';
  latestData.condensed = condensedRows;
  latestData.labels = { qLabel, pLabel };

  /* === Last-bar QoQ/YoY comparison (view-by-aware) === Quarterly: the last
     bar's own comparison is QoQ (vs p, the immediately prior quarter) plus
     a genuine YoY (vs 4 quarters back) when that quarter exists in this
     page's data; Annual: p IS the prior FY-anchor already, so that one
     comparison reads as YoY (no QoQ concept at annual granularity). Same
     {text,color} shape buildStackedBarSVG's opts.lastBarExtraLines already
     expects (used elsewhere on this dashboard for the same purpose). */
  const goodC = cssVar('--good-text')||'#006300', badC = cssVar('--critical')||'#d03b3b';
  function lastBarComparisons(totalsByIdx){
    const lines = [];
    const cur = totalsByIdx[q];
    const priorVal = totalsByIdx[p];
    if(priorVal){
      const d = (cur-priorVal)/Math.abs(priorVal)*100;
      const tag = currentViewBy==='annual' ? 'YoY' : 'QoQ';
      lines.push({ text: tag+' '+fmtSignedPct(d,1), color: d>=0?goodC:badC });
    }
    if(currentViewBy!=='annual' && q-4>=0){
      const yoyVal = totalsByIdx[q-4];
      if(yoyVal){ const d=(cur-yoyVal)/Math.abs(yoyVal)*100; lines.push({ text:'YoY '+fmtSignedPct(d,1), color: d>=0?goodC:badC }); }
    }
    return lines;
  }

  /* === Asset Breakdown (Part B: full multi-period window, not just [p,q]) === */
  const assetSeries = ASSET_CATEGORIES.map((name,i)=>({ name, color: resolveColor(RAG_COLORS[i % RAG_COLORS.length]), values: win.idxs.map(idx=>assetByQ[idx][i]) }));
  buildStackedBarSVG('assetChart', { labels: win.labels, series: assetSeries, valueFormatter: fmtTHB, showTotalLabels:true, lastBarExtraLines: lastBarComparisons(totalAssetsByQ) });
  document.getElementById('assetLegend').innerHTML = assetSeries.map(s=>'<span class="chart-legend-item"><span class="chart-legend-dot" style="background:'+s.color+'"></span>'+s.name+'</span>').join('');
  latestData.asset = { labels: win.labels, series: assetSeries };

  /* === Liabilities & Equity Breakdown (Part B: full multi-period window) === */
  const liabEquityTotalByQ = liabEquityByQ.map(row=> row.reduce((a,b)=>a+b,0));
  const liabSeries = liabEquityCategories.map((name,i)=>({ name, color: resolveColor(RAG_COLORS[i % RAG_COLORS.length]), values: win.idxs.map(idx=>liabEquityByQ[idx][i]) }));
  buildStackedBarSVG('liabChart', { labels: win.labels, series: liabSeries, valueFormatter: fmtTHB, showTotalLabels:true, lastBarExtraLines: lastBarComparisons(liabEquityTotalByQ) });
  document.getElementById('liabLegend').innerHTML = liabSeries.map(s=>'<span class="chart-legend-item"><span class="chart-legend-dot" style="background:'+s.color+'"></span>'+s.name+'</span>').join('');
  latestData.liab = { labels: win.labels, series: liabSeries };
}

/* --- Toolbar --- */
document.getElementById('condensedDownloadBtn').addEventListener('click', ()=>{
  const rows = [['Line Item', latestData.labels.pLabel, latestData.labels.qLabel, 'Delta', '% Change']];
  latestData.condensed.forEach(r=> rows.push([r.label, Math.round(r.q1), Math.round(r.q2), Math.round(r.q2-r.q1), (r.q1?((r.q2-r.q1)/r.q1*100):0).toFixed(1)]));
  downloadCSV(rows, 'pnl_condensed_balance_sheet.csv');
});
document.getElementById('assetDownloadBtn').addEventListener('click', ()=> downloadSVGFromContainer('assetChart', 'pnl_balance_sheet_assets.svg'));
document.getElementById('assetExpandBtn').addEventListener('click', (e)=> toggleFullscreen(e.currentTarget.closest('.card')));
document.getElementById('assetTableBtn').addEventListener('click', ()=>{
  const wrap = document.getElementById('assetTableWrap');
  const canvasWrap = document.getElementById('assetCanvasWrap');
  const showing = wrap.classList.contains('visible');
  if(showing){ wrap.classList.remove('visible'); canvasWrap.classList.remove('hidden'); return; }

  wrap.innerHTML = html; wrap.classList.add('visible'); canvasWrap.classList.add('hidden');
});
document.getElementById('liabDownloadBtn').addEventListener('click', ()=> downloadSVGFromContainer('liabChart', 'pnl_balance_sheet_liabilities_equity.svg'));
document.getElementById('liabExpandBtn').addEventListener('click', (e)=> toggleFullscreen(e.currentTarget.closest('.card')));
document.getElementById('liabTableBtn').addEventListener('click', ()=>{

  html += '</tbody></table>';
  wrap.innerHTML = html; wrap.classList.add('visible'); canvasWrap.classList.add('hidden');
});

/* ---------- Filter bar: View By + As of (same pattern as Financial Analysis) ----------
   Quarterly As of offers the 5 selectable quarters (Part B: Q2'25-Q2'26,
   idx2-6) -- idx0/idx1 (Q4'24/Q1'25) exist only as backing data for the
   trailing-window clip and the Annual FY2024 bucket, not as their own
   selectable option. Annual As of offers FY2025/2026 (Current) -- FY2024
   is excluded the same way (no prior year to compare against). */
function positionViewByThumb(){
  const toggle = document.getElementById('viewByToggle');
  const thumb = document.getElementById('viewByThumb');
  const selected = toggle.querySelector('.timeframe-opt.selected');
  thumb.style.width = selected.offsetWidth + 'px';
  thumb.style.transform = 'translateX(' + (selected.offsetLeft - 2) + 'px)';
}
function buildAsOfDropdown(){
  let html = '';
  if(currentViewBy==='annual'){
    const opts = [['current','2026 (Current)'],['fy2025','FY2025']];
    opts.forEach(([key,label])=>{
      const sel = pnlAnnualAnchor===key;
      html += '<div class="period-opt'+(sel?' selected':'')+'" data-annual="'+key+'"><span class="chk">'+(sel?'✓':'')+'</span>'+label+'</div>';
    });
  } else {
    for(let i=quarterLabels.length-1; i>=2; i--){
      const sel = pnlQuarterAnchor===i;
      html += '<div class="period-opt'+(sel?' selected':'')+'" data-quarter="'+i+'"><span class="chk">'+(sel?'✓':'')+'</span>'+quarterLabels[i]+'</div>';
    }
  }
  document.getElementById('periodDropdown').innerHTML = html;
}
function updateAsOfControl(){
  document.getElementById('periodBtnLabel').textContent = currentAsOfLabel();
  buildAsOfDropdown();
}
document.getElementById('viewByToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('.timeframe-opt');
  if(!btn || btn.classList.contains('selected')) return;
  document.querySelectorAll('#viewByToggle .timeframe-opt').forEach(o=>o.classList.remove('selected'));
  btn.classList.add('selected');
  positionViewByThumb();
  currentViewBy = btn.dataset.key;
  updateAsOfControl();
  renderAll();
});
document.getElementById('periodBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  document.getElementById('periodDropdown').classList.toggle('open');
});
document.getElementById('periodDropdown').addEventListener('click', (e)=>{
  const opt = e.target.closest('.period-opt');
  if(!opt) return;
  if(opt.dataset.quarter) pnlQuarterAnchor = parseInt(opt.dataset.quarter,10);
  if(opt.dataset.annual) pnlAnnualAnchor = opt.dataset.annual;
  document.getElementById('periodDropdown').classList.remove('open');
  updateAsOfControl();
  renderAll();
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.filter-item')) document.getElementById('periodDropdown').classList.remove('open');
});
positionViewByThumb();
buildAsOfDropdown();

/* ---------- Reference section collapse toggle (chart-first restructure) ---------- */
document.getElementById('referenceToggleBtn').addEventListener('click', (e)=>{
  const wrap = document.getElementById('referenceTableWrap');
  const opening = !wrap.classList.contains('open');
  wrap.classList.toggle('open', opening);
  e.currentTarget.lastChild.textContent = opening ? ' Hide detailed balance sheet' : ' Show detailed balance sheet';
});

/* ---------- Init ---------- */
renderAll();
</script>
